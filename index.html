<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro | Web Design Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Space Grotesk', sans-serif;
  background: radial-gradient(circle at top, #0b1220, #020617);
  color: white;
}

/* HERO */
header {
  text-align: center;
  padding: 140px 20px 100px;
  background: linear-gradient(135deg, #111827, #0b1220);
}

h1 {
  font-size: 96px;
  margin: 0;
  letter-spacing: -2px;
  font-weight: 700;
  text-transform: uppercase;
  background: linear-gradient(90deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  font-size: 22px;
  color: #cbd5e1;
  margin-top: 15px;
  font-weight: 400;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 30px;
  padding: 16px 34px;
  background: #3b82f6;
  border-radius: 14px;
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-4px) scale(1.05);
  background: #2563eb;
}

/* SECTIONS */
section {
  max-width: 1100px;
  margin: auto;
  padding: 90px 20px;
}

h2 {
  font-size: 46px;
  margin-bottom: 25px;
  letter-spacing: -1px;
  font-weight: 700;
  color: #60a5fa;
}

/* TEXT */
.bigtext {
  font-size: 20px;
  color: #cbd5e1;
  line-height: 1.8;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

/* CARDS */
.card {
  background: rgba(255,255,255,0.05);
  padding: 22px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.4s ease;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #3b82f6;
}

/* PRICING */
.pricing {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

.plan {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 25px;
  transition: 0.4s ease;
}

.plan:hover {
  transform: translateY(-10px);
  border-color: #60a5fa;
}

.price {
  font-size: 38px;
  font-weight: 700;
  margin: 10px 0;
  color: #60a5fa;
}

ul {
  padding-left: 18px;
  color: #cbd5e1;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 50px;
  color: #94a3b8;
}
</style>
</head>
